<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CelSync by Celetel: sales outreach CRM demo.">
<meta name="robots" content="noindex">
<title>CelSync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Figtree:wght@400;500;600;700&family=Urbanist:wght@400;500;600;700&display=swap">
<style>
/* Layout: frosted-glass CRM shell — floating pill nav, constant left action rail, flex-wrap card rows per approved wireframes */
:root{
  /* Celetel logo palette: blue #1A86CE · sky #7CC4F2 · lime #C3DA0A · leaf green #7AA02A · ink #111 */
  --bg:#E4EEF5; --blob1:rgba(26,134,206,.42); --blob2:rgba(195,218,10,.40); --blob3:rgba(124,196,242,.55); --blob4:rgba(122,160,42,.30);
  --surface:rgba(255,255,255,.24); --surface-2:rgba(255,255,255,.48); --sunken:rgba(255,255,255,.26); --hover:rgba(255,255,255,.40);
  --glass:linear-gradient(140deg,rgba(255,255,255,.34),rgba(255,255,255,.10)); --edge:rgba(255,255,255,.68); --blur:blur(20px) saturate(170%);
  --line:rgba(17,17,17,.08); --line-2:rgba(17,17,17,.14);
  --ink:#111417; --muted:#4A5560; --faint:#8A949E;
  --accent:#1478BE; --accent-ink:#FFFFFF; --accent-soft:rgba(26,134,206,.13); --accent-text:#0E6098;
  --s-researched:#9AA6B2; --s-contacted:#7CC4F2; --s-replied:#C3DA0A; --s-meeting:#7AA02A; --s-proposal:#1A86CE;
  --ok:#5E8E14; --ok-soft:rgba(122,160,42,.16); --warn:#C2410C; --warn-soft:rgba(234,88,12,.12); --ring:#8DB51A;
  --shadow:0 10px 34px rgba(20,60,90,.10),inset 0 1px 0 rgba(255,255,255,.85); --shadow-lg:0 24px 60px rgba(20,50,80,.20);
  --scrim:rgba(220,232,240,.45); --bgimg:none; --inner:rgba(255,255,255,.30); --inner-edge:rgba(255,255,255,.66); --c1:#1A86CE; --c2:#8DB51A;
  --display:"Urbanist",ui-sans-serif,system-ui,sans-serif; --body:"Urbanist",ui-sans-serif,system-ui,sans-serif;
  --r-card:26px; --r-inner:18px;
}
/* Light glass (above) is the default. The Theme button switches to this Solvik-style smoky glass */
:root[data-theme="dark"]{
  --bg:#141517; --bgimg:linear-gradient(180deg,#46505E 0%,#3A3D43 26%,#4B4038 52%,#2A231F 74%,#0F0D0C 100%);
  --blob1:rgba(120,140,170,.38); --blob2:rgba(150,110,85,.34); --blob3:rgba(95,105,125,.30); --blob4:rgba(170,120,95,.22);
  --surface:rgba(255,255,255,.07); --surface-2:rgba(255,255,255,.13); --sunken:rgba(255,255,255,.06); --hover:rgba(255,255,255,.09);
  --glass:linear-gradient(165deg,rgba(38,38,42,.52),rgba(14,14,16,.40)); --edge:rgba(255,255,255,.09); --blur:blur(26px) saturate(125%);
  --inner:rgba(255,255,255,.13); --inner-edge:rgba(255,255,255,.17);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --ink:#F4F2EE; --muted:#AAA7A1; --faint:#77746F;
  --accent:#CFF26E; --accent-ink:#17200A; --accent-soft:rgba(207,242,110,.16); --accent-text:#DDF7A0;
  --s-researched:#B9AEF5; --s-contacted:#8DB8F7; --s-replied:#CFF26E; --s-meeting:#F2957A; --s-proposal:#EFEDE7;
  --c1:#F2957A; --c2:#CFF26E; --ring:#CFF26E;
  --ok:#CFF26E; --ok-soft:rgba(207,242,110,.16); --warn:#F7A98F; --warn-soft:rgba(242,149,122,.18);
  --shadow:0 12px 40px rgba(0,0,0,.28); --shadow-lg:0 30px 70px rgba(0,0,0,.55);
  --scrim:rgba(10,9,8,.45); color-scheme:dark;
  --display:"Urbanist",ui-sans-serif,system-ui,sans-serif; --body:"Urbanist",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bgimg),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 26s ease-in-out infinite alternate}
.bgfx i:nth-child(2){animation-duration:32s}.bgfx i:nth-child(3){animation-duration:38s}.bgfx i:nth-child(4){animation-duration:22s}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.08)}}
.bgfx i:nth-child(1){width:55vw;height:45vw;left:-12vw;top:-16vw;background:var(--blob1)}
.bgfx i:nth-child(2){width:45vw;height:42vw;right:-10vw;top:12vh;background:var(--blob3)}
.bgfx i:nth-child(3){width:52vw;height:40vw;left:22vw;bottom:-20vw;background:var(--blob2)}
.bgfx i:nth-child(4){width:30vw;height:30vw;left:30vw;top:30vh;background:var(--blob4)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 16px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;flex:1 1 180px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#14B8A6));color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.logo svg{width:22px;height:22px;stroke-width:2.2}
.brand b{font-family:var(--display);font-size:23px;font-weight:500;letter-spacing:-.01em}
.navwrap{max-width:100%;overflow-x:auto;scrollbar-width:none;flex:0 1 auto}
.navwrap::-webkit-scrollbar{display:none}
.nav{display:flex;gap:2px;padding:5px;border-radius:99px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);white-space:nowrap;box-shadow:var(--shadow)}
.nav a{padding:10px 18px;border-radius:99px;text-decoration:none;font-weight:500;color:var(--muted);transition:background .2s,color .2s}
.nav a:hover{color:var(--ink);background:var(--hover)}
.nav a.on{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex:1 1 180px}
.ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;position:relative;transition:background .2s,transform .2s;background:var(--surface);flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn.sm{width:36px;height:36px}
.ibtn.sm svg{width:16px;height:16px}
.ibtn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--s-proposal);border:2px solid var(--bg)}
.me{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;display:grid;place-items:center}

.shell{display:grid;grid-template-columns:64px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:20px;margin-top:132px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-radius:40px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--shadow)}
.rail button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative;transition:background .2s}
.rail button:hover{background:var(--hover)}
.rail hr{width:26px;border:0;border-top:1px solid var(--line-2);margin:6px 0}
.rail button .tip{position:absolute;left:54px;top:50%;transform:translate(-4px,-50%);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;padding:5px 10px;border-radius:8px;white-space:nowrap;transition:opacity .15s,transform .15s;z-index:20}
.rail button:hover .tip,.rail button:focus-visible .tip{opacity:1;transform:translate(0,-50%)}

.view{min-width:0}
.view.enter{animation:enter .45s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;filter:blur(8px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}

/* ---------- page header ---------- */
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:22px 40px;margin-bottom:24px}
.phead h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,4vw,50px);line-height:1.02;letter-spacing:-.025em;margin:0;text-wrap:balance}
.kpis{display:flex;flex-wrap:wrap;gap:18px 34px;flex:1}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ring{width:54px;height:54px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;background:var(--surface)}
.kpi b{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:26px;font-weight:500;letter-spacing:-.01em}
.kpi .lbl{display:block;color:var(--muted);font-size:13.5px}
.phead .right{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- primitives ---------- */
.badge{font-family:var(--body);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap;letter-spacing:0}
.badge.up{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%}
.tag.auto{background:var(--accent-soft);color:var(--accent-text);font-weight:700;letter-spacing:.02em;font-size:10.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line-2);font-weight:600;font-size:13.5px;white-space:nowrap;background:var(--surface);transition:background .2s,transform .1s,box-shadow .2s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.pri:hover{box-shadow:0 6px 16px rgba(14,22,38,.18)}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;background:var(--surface);transition:background .2s}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip .av{width:24px;height:24px;font-size:9.5px;margin-left:-8px}
.seg{display:inline-flex;padding:4px;border-radius:99px;background:var(--sunken);border:1px solid var(--line)}
.seg button{height:30px;padding:0 13px;border-radius:99px;font-weight:600;font-size:12.5px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--surface-2);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,38,.12)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:#0E1626}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;height:40px;border-radius:99px;background:var(--surface);border:1px solid var(--line-2);flex:0 1 260px;min-width:180px}
.search input{background:none;border:0;outline:0;width:100%;min-width:0}
::placeholder{color:var(--muted);opacity:.85}
.search svg{color:var(--muted);width:16px;height:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.toolbar .sp{flex:1}
.vr{width:1px;height:24px;background:var(--line-2);margin:0 4px}

/* ---------- cards ---------- */
.row{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:22px;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:40px;flex-wrap:wrap}
.ch h3{margin:0;font-size:17px;font-weight:500;font-family:var(--display);letter-spacing:-.005em}
.ch small{color:var(--muted);font-size:12.5px}
.ch .sp{flex:1}
.big{font-family:var(--display);font-size:clamp(40px,4.2vw,56px);font-weight:500;letter-spacing:-.03em;line-height:1}
.sub{color:var(--muted)}
.cap{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:22px;font-size:13px}
.note{padding:11px 14px;border-radius:14px;background:var(--sunken);font-size:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:12px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}
.legend .dash{width:16px;height:0;border-top:2px dashed var(--ink);border-radius:0;opacity:.7}
.prog{height:6px;border-radius:9px;background:var(--sunken);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:var(--ink);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:600;display:block;font-size:13.5px}
.li .t span{color:var(--muted);font-size:12.5px}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;cursor:pointer;font-weight:500}
.lnk:hover{text-decoration-color:var(--ink)}
.mini{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;color:var(--muted);transition:background .2s,color .2s}
button.mini:hover{background:var(--hover);color:var(--ink)}
.mini svg{width:15px;height:15px}
.check{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--line-2);display:grid;place-items:center;flex:none;transition:background .2s}
.check.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.check svg{width:13px;height:13px;stroke-width:3}
.li.done .t b{text-decoration:line-through;color:var(--faint)}

/* chart */
.chart{position:relative;width:100%;margin-top:6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--body)}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:8px 12px;font-size:12px;backdrop-filter:blur(20px);white-space:nowrap;box-shadow:var(--shadow-lg);transform:translate(-50%,-115%)}
.draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1.4s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* hot */
.hotgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;flex:1}
.deal{border-radius:var(--r-inner);padding:15px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-height:186px;text-align:left;min-width:0;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.deal::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--sc)}
.deal:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.deal .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.deal h4{margin:8px 0 0;font-family:var(--display);font-weight:500;font-size:17px;line-height:1.2;letter-spacing:-.005em}
.deal .co{color:var(--muted);font-size:12.5px}
.deal .val{margin-top:auto;font-family:var(--display);font-size:22px;font-weight:500}
.deal .val small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.fit{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunken);color:var(--ink)}

/* gauge */
.gauge{position:relative;width:170px;max-width:100%;margin:0 auto}
.gauge svg{width:100%;height:auto;display:block}
.gauge .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .mid b{font-family:var(--display);font-size:40px;font-weight:500;display:block;line-height:1}
.trio{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px;margin:6px 0 14px}
.trio span{display:block;color:var(--muted);font-size:12px}
.trio b{font-family:var(--display);font-size:17px;font-weight:500}
.target{background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface))}

/* stage mix */
.stackbar{display:flex;gap:6px;height:46px;margin:16px 0}
.stackbar div{border-radius:12px;min-width:12px;transition:flex .5s}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 36px 72px 44px;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13.5px}
.srow:last-child{border-bottom:0}
.srow span:not(:first-child){text-align:right}
.srow i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:10px}

/* leaderboard */
.lb{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-inner);transition:background .2s}
.lb.top{background:var(--sunken)}
.lb .rk{width:16px;text-align:center;font-weight:700;color:var(--muted)}
.lb .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lb .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lb .nm b{font-weight:600}
.lb .nm .won{margin-left:auto;font-family:var(--display);font-size:17px;font-weight:500}
.role{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.role.Admin{background:var(--ink);color:var(--bg)}
.role.Manager{background:var(--accent-soft);color:var(--accent-text)}
.role.Member{background:var(--sunken);color:var(--muted)}

.up{display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--sunken);margin-top:6px}
.up .d{font-weight:700;font-size:12px;line-height:1.15;width:30px;text-align:center}
.up .d small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}

/* prospects */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.pcard{border-radius:var(--r-card);padding:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0;transition:transform .2s,box-shadow .2s,background .2s;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.pcard:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(15,23,38,.10)}
.pcard .hd{display:flex;justify-content:space-between;align-items:flex-start}
.star{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--faint);transition:color .2s,background .2s}
.star:hover{background:var(--hover)}
.star.on{color:#F2A93B}
.star.on svg{fill:currentColor}
.pcard h4{margin:0;font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:-.005em}
.pcard .meta{color:var(--muted);font-size:12.5px}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;border-radius:14px;background:var(--sunken)}
.stat2 span{display:block;color:var(--muted);font-size:11.5px}
.stat2 b{font-weight:600;font-size:13.5px}
.fitbar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.fitbar .prog{flex:1}
.fitbar b{color:var(--ink)}
.pcard .ft{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.pcard .ft span{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* table */
.tablewrap{overflow-x:auto;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:820px}
th{color:var(--muted);font-weight:600;font-size:12px;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}

/* kanban */
.boardwrap{overflow-x:auto;padding-bottom:8px}
.board{display:flex;gap:12px;min-width:1120px;align-items:stretch}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:10px;background:var(--sunken);border-radius:22px;padding:8px;transition:background .2s,box-shadow .2s;min-height:420px}
.col.over{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.colh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:13px}
.colh i{width:9px;height:9px;border-radius:50%}
.colh small{color:var(--muted);font-weight:500}
.colh .tot{margin-left:auto;font-size:12px}
.colh button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.colh button:hover{background:var(--hover);color:var(--ink)}
.colh button svg{width:14px;height:14px}
.kcard{background:var(--surface-2);border:1px solid var(--line);border-top:3px solid var(--sc);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:grab;transition:transform .15s,box-shadow .15s;text-align:left}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kcard.drag{opacity:.35}
.kcard .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}
.kcard b{font-family:var(--display);font-weight:500;font-size:15px;line-height:1.25}
.kcard .co{color:var(--muted);font-size:12.5px}
.kcard .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;gap:6px}
.kcard .val{font-family:var(--display);font-size:18px;font-weight:500}
.kcard .val small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:400}
.wl{flex:0 0 132px;display:flex;flex-direction:column;gap:12px}
.zone{flex:1;border-radius:22px;border:1.5px dashed var(--line-2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;color:var(--muted);font-size:12px;transition:background .2s,border-color .2s}
.zone b{color:var(--ink);font-family:var(--display);font-weight:500;font-size:16px}
.zone .zi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--ink)}
.zone.won .zi{background:var(--ok);color:#fff}
.zone.over{border-color:var(--accent);background:var(--accent-soft)}

/* outreach */
.draft{border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--sunken);display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.draft .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.draft .hd b{font-weight:600}
.mail{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mail .to{font-size:12.5px;color:var(--muted)}
.mail .su{font-weight:600}
.mail .bd{color:var(--muted);font-size:13px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.draft .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.seqi{display:flex;gap:14px;align-items:center;padding:10px 0;position:relative}
.seqi:not(:last-of-type)::after{content:"";position:absolute;left:26px;top:64px;height:20px;border-left:2px dashed var(--line-2)}
.seqi .dd{width:54px;height:54px;border-radius:18px;background:var(--sunken);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);line-height:1.05;flex:none}
.seqi .dd small{font-size:10.5px;color:var(--muted);font-family:var(--body)}
.seqi .dd b{font-size:18px;font-weight:500}
.seqi .t{flex:1;min-width:0}
.seqi .t b{font-weight:600;display:block}
.seqi .t span{color:var(--muted);font-size:12.5px}
.rules{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:var(--sunken);font-size:13px;margin-top:8px}
.rules span{display:flex;gap:8px;align-items:center}
.rules svg{width:15px;height:15px;color:var(--ok)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tpl{border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--sunken);display:flex;flex-direction:column;gap:8px;min-width:0}
.tpl .su{font-size:12.5px;color:var(--ink);opacity:.85}
.tpl p{margin:0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tpl .ft{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.tpl .ft span{flex:1;font-size:12px;color:var(--muted)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{color:var(--muted);font-size:12px;font-weight:600;padding:0 0 4px 6px}
.cell{min-height:96px;border-radius:14px;background:var(--sunken);border:1px solid var(--line);padding:7px;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .2s}
.cell:hover{background:var(--surface-2)}
.cell.out{opacity:.45}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink);background:var(--surface-2)}
.cell .n{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.cell.today .n span{background:var(--ink);color:var(--bg);border-radius:99px;padding:0 7px}
.ev{display:flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 6px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;overflow:hidden;min-width:0}
.ev i{width:6px;height:6px;border-radius:50%;flex:none}
.ev span{overflow:hidden;text-overflow:ellipsis}
.ev.fu{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.more{font-size:10.5px;color:var(--muted);padding-left:4px}
.od{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--warn-soft);margin-top:6px}
.od .t{flex:1;min-width:0}
.od .t b{font-weight:600;font-size:13.5px;display:block}
.od .t span{color:var(--warn);font-size:12.5px}

/* insights */
.hbar{display:grid;grid-template-columns:160px minmax(0,1fr) 48px;gap:12px;align-items:center;padding:6px 0}
.hbar .tr{height:12px;border-radius:9px;background:var(--sunken);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:9px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.hbar>span:last-child{text-align:right;font-weight:700}
.hbar small{color:var(--muted);font-size:12px}
.wk{display:flex;align-items:flex-end;gap:10px;height:200px}
.wk div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.wk i{width:100%;border-radius:10px 10px 4px 4px;background:var(--sunken);transition:height .8s cubic-bezier(.2,.7,.2,1)}
.wk i.now{background:var(--accent)}
.wk span{font-size:11px;color:var(--muted)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px;gap:8px;padding:11px 10px;border-bottom:1px solid var(--line);align-items:center;border-radius:10px}
.trow.best{background:var(--accent-soft)}
.trow span:not(:first-child){text-align:right}

/* forms, overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface-2);border:1px solid var(--line-2);border-radius:26px;padding:22px;box-shadow:var(--shadow-lg);animation:pop .25s cubic-bezier(.2,.7,.2,1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .modal,:root:not([data-theme="light"]) .drawer,:root:not([data-theme="light"]) .pop{background:#141B2D}}
:root[data-theme="dark"] .modal,:root[data-theme="dark"] .drawer,:root[data-theme="dark"] .pop{background:#141B2D}
@keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}}
.mh{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.mh h3{margin:0;font-family:var(--display);font-weight:500;font-size:20px}
.mh p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{color:var(--muted);font-size:12.5px;font-weight:500}
.field input,.field select,.field textarea{background:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0;width:100%;transition:border-color .2s,background .2s}
.field textarea{min-height:150px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface-2)}
.field select option{background:var(--bg);color:var(--ink)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);z-index:60;background:var(--surface-2);border-left:1px solid var(--line-2);box-shadow:var(--shadow-lg);overflow-y:auto;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-right:max(24px,env(safe-area-inset-right,0px));animation:slide .3s cubic-bezier(.2,.7,.2,1)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.drawer h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0;letter-spacing:-.01em}
.dsec{margin-top:22px}
.dsec h5{margin:0 0 8px}
.stp{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--sunken);margin-bottom:6px;font-size:13.5px}
.pop{position:fixed;z-index:55;min-width:240px;max-width:320px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:18px;padding:8px;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.pop .mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;text-align:left;font-size:13.5px}
.pop .mi:hover{background:var(--hover)}
.pop .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px 4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;gap:8px;align-items:center;padding:11px 16px;border-radius:99px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lg);animation:pop .2s;font-size:13px;font-weight:500;max-width:calc(100% - 32px)}

/* ---------- glass layer ---------- */
.card,.nav,.rail,.pcard,.tablewrap{background:var(--glass);border:1px solid var(--edge);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.ibtn,.btn:not(.pri):not(.acc),.chip:not(.on),.search,.seg,.kpi .ring{background:var(--surface);border-color:var(--edge);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.ibtn:hover,.btn:not(.pri):not(.acc):hover,.chip:not(.on):hover{background:var(--surface-2)}
.deal,.kcard,.colh,.mail,.up,.cell,.draft,.tpl,.stat2,.note,.rules,.lb.top,.od{border-color:var(--edge)}
.deal,.kcard,.colh,.mail{background:rgba(255,255,255,.26);backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%)}
.col{background:rgba(255,255,255,.10);border:1px solid var(--edge)}
.zone{background:rgba(255,255,255,.14);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.target{background:linear-gradient(160deg,rgba(110,140,255,.28),rgba(255,255,255,.08))}
.modal,.drawer,.pop{background:rgba(255,255,255,.52);border-color:var(--edge);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%)}
.logo{overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
/* Solvik-style smoky glass details */
:root[data-theme="dark"] .deal,:root[data-theme="dark"] .colh,:root[data-theme="dark"] .mail,:root[data-theme="dark"] .tpl,:root[data-theme="dark"] .draft,:root[data-theme="dark"] .cell,:root[data-theme="dark"] .stat2,:root[data-theme="dark"] .note,:root[data-theme="dark"] .rules,:root[data-theme="dark"] .up,:root[data-theme="dark"] .lb.top{background:var(--inner);border-color:var(--inner-edge)}
:root[data-theme="dark"] .deal{min-height:210px}
:root[data-theme="dark"] .deal::before{display:none}
:root[data-theme="dark"] .kcard{background:color-mix(in srgb,var(--sc) 22%,rgba(58,58,62,.55));border:1px solid color-mix(in srgb,var(--sc) 32%,transparent)}
:root[data-theme="dark"] .col{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.07)}
:root[data-theme="dark"] .zone{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.16)}
:root[data-theme="dark"] .target{background:linear-gradient(165deg,rgba(118,138,52,.58),rgba(48,56,26,.48));border-color:rgba(207,242,110,.28)}
:root[data-theme="dark"] .nav a.on{background:rgba(255,255,255,.14);color:var(--ink)}
:root[data-theme="dark"] .chip.on{background:rgba(255,255,255,.16);color:var(--ink);border-color:rgba(255,255,255,.22)}
:root[data-theme="dark"] .seg button.on{background:rgba(255,255,255,.16);box-shadow:none}
:root[data-theme="dark"] .btn.pri,:root[data-theme="dark"] .me,:root[data-theme="dark"] .logo{background:var(--accent);color:var(--accent-ink);box-shadow:none}
:root[data-theme="dark"] .check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:root[data-theme="dark"] .role.Admin{background:var(--accent);color:var(--accent-ink)}
:root[data-theme="dark"] .modal,:root[data-theme="dark"] .drawer,:root[data-theme="dark"] .pop{background:rgba(34,32,32,.80)}
:root[data-theme="dark"] .toast{background:rgba(36,35,36,.92);color:var(--ink);border:1px solid var(--edge)}
:root[data-theme="dark"] .bgfx i{filter:blur(110px)}
/* staggered card entrance, like Solvik */
.view.enter .card,.view.enter .pcard{animation:cardIn .7s cubic-bezier(.2,.7,.2,1) both}
.view.enter .card:nth-child(2){animation-delay:.07s}.view.enter .card:nth-child(3){animation-delay:.14s}
.view.enter .pcard:nth-child(2){animation-delay:.05s}.view.enter .pcard:nth-child(3){animation-delay:.1s}.view.enter .pcard:nth-child(4){animation-delay:.15s}.view.enter .pcard:nth-child(5){animation-delay:.2s}.view.enter .pcard:nth-child(n+6){animation-delay:.25s}
@keyframes cardIn{from{opacity:0;filter:blur(10px);transform:translateY(10px)}}

/* light theme details (default) */
:root:not([data-theme="dark"]) .btn.pri,:root:not([data-theme="dark"]) .me{background:var(--accent);color:#fff}
:root:not([data-theme="dark"]) .check.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root:not([data-theme="dark"]) .target{background:linear-gradient(160deg,rgba(195,218,10,.30),rgba(124,196,242,.14))}
:root:not([data-theme="dark"]) .kcard{background:color-mix(in srgb,var(--sc) 16%,rgba(255,255,255,.34))}
:root:not([data-theme="dark"]) .tag.auto{background:var(--accent-soft);color:var(--accent-text)}
/* controls added for full functionality */
.hint{margin:-6px 0 12px;color:var(--muted);font-size:12.5px}
.kmore{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);margin:-6px -6px -6px 0}
.kmore:hover{background:var(--hover);color:var(--ink)}
.stackbar button{border-radius:12px;min-width:12px;cursor:pointer;transition:filter .2s}
.stackbar button:hover{filter:brightness(1.08) saturate(1.1)}
button.hbar,button.trow{width:100%;text-align:left;border-radius:10px;cursor:pointer;transition:background .2s}
button.hbar:hover,button.trow:hover{background:var(--hover)}
button.up{width:100%;text-align:left;cursor:pointer}
button.up:hover{background:var(--hover)}
button.stp{width:100%;text-align:left;cursor:pointer;border:1px solid transparent}
button.stp:hover{border-color:var(--line-2)}
.cell{cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{display:flex;flex-direction:column;gap:6px;min-height:300px;padding:6px;border-radius:16px;background:var(--sunken);border:1px solid var(--edge);min-width:0}
.wday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wh{display:flex;flex-direction:column;align-items:center;padding:6px;border-radius:12px}
.wh:hover{background:var(--hover)}
.wh small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.wh b{font-family:var(--display);font-size:20px;font-weight:600}
.wev{display:flex;gap:6px;align-items:flex-start;text-align:left;padding:7px 8px;border-radius:10px;background:var(--inner);border:1px solid var(--inner-edge);font-size:12px;min-width:0}
.wev:hover{background:var(--surface-2)}
.wev i{width:7px;height:7px;border-radius:50%;flex:none;margin-top:5px}
.wev span{min-width:0}.wev b{display:block;font-weight:600;overflow-wrap:anywhere}.wev small{color:var(--muted)}
.wev.fu{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle b{display:block;font-weight:600}.toggle span{color:var(--muted);font-size:12.5px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(18px)}
.rolesel{background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;font-weight:600}
.pop .ph .lnk{font-weight:600}
@media (max-width:860px){.week{grid-template-columns:1fr}.wday{min-height:0}}
@media (max-width:620px){.phead h1{flex-basis:100%}.phead .kpis{gap:14px 24px}}
.logo-img{height:42px;width:auto;display:block}
.appname{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;padding-left:12px;margin-left:2px;border-left:1.5px solid var(--line-2);line-height:30px;white-space:nowrap}
@media (max-width:420px){.appname{font-size:18px;padding-left:9px}}
.logo-img.dk{display:none}
:root[data-theme="dark"] .logo-img.lt{display:none}
:root[data-theme="dark"] .logo-img.dk{display:block}
.rail{z-index:30}
.top{position:relative;z-index:31}

/* responsive */
@media (max-width:860px){
  .brand{flex:1 1 auto}.tools{flex:0 0 auto}
  .navwrap{order:3;flex-basis:100%}
  .nav{display:inline-flex}
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;margin-top:0;flex-direction:row;overflow-x:auto;justify-content:flex-start;padding:6px 10px;border-radius:99px;order:-1;scrollbar-width:none}
  .rail hr{width:0;height:24px;border-top:0;border-left:1px solid var(--line-2);margin:0 4px}
  .rail button .tip{display:none}
  .form{grid-template-columns:1fr}
  .cal{gap:3px}.cell{min-height:58px;padding:4px}.ev span{display:none}.ev{padding:2px;justify-content:center}.dow{padding-left:2px}
  .phead{gap:16px 24px}
}
@media (max-width:520px){
  .hotgrid{grid-template-columns:1fr}
  .card{padding:18px}
  .hbar{grid-template-columns:110px 1fr 40px}
  .brand b{font-size:20px}
  .kpi .ring{width:46px;height:46px}
  .kpi b{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
</style>

const kpi=(i,val,label,badge='')=>`<div class="kpi"><div class="ring">${ic(i)}</div><div><b class="num"><span ${typeof val==='number'?`data-count="${val}"`:''}>${typeof val==='number'?val.toLocaleString('en-IN'):val}</span>${badge}</b><span class="lbl">${label}</span></div></div>`;

const seg=(act,opts,cur)=>`<div class="seg" role="group">${opts.map(([k,l])=>`<button data-act="${act}" data-k="${k}" class="${cur===k?'on':''}" aria-pressed="${cur===k}">${l}</button>`).join('')}</div>`;

function countUp(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 document.querySelectorAll('[data-count]').forEach(el=>{const to=parseFloat(el.dataset.count);if(isNaN(to))return;const t0=performance.now(),D=850;
  const tick=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e).toLocaleString('en-IN');if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)});
}

/* ================= charts ================= */
function months(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date(T0.getFullYear(),T0.getMonth()-i,1);out.push(d.toLocaleDateString('en-IN',{month:'short'}))}return out}
const SENT=[30,34,38,40,42,44,46,52,50,56,60,56], REPL=[5,6,7,7,8,8,9,12,9,11,12,11];
function smooth(pts){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2;d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`}return d}
function lineChart(el,labels,series,target,maxY){
 const W=760,H=260,L=36,R=14,Tp=14,B=30,iw=W-L-R,ih=H-Tp-B;
 const x=i=>L+i*iw/(labels.length-1), y=v=>Tp+ih-(v/maxY)*ih;
 let g='';
 [0,maxY/2,maxY].forEach(t=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line-2)" stroke-dasharray="3 6"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${Math.round(t)}</text>`});
 labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`);
 g+=`<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="7 7" opacity=".5"/>`;
 series.forEach((s,si)=>{const pts=s.data.map((v,i)=>[x(i),y(v)]),path=smooth(pts);
  if(s.fill)g+=`<defs><linearGradient id="gf${si}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".30"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="${path} L${x(s.data.length-1)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#gf${si})"/>`;
  g+=`<path class="draw" d="${path}" fill="none" stroke="${s.color}" stroke-width="2.8" stroke-linecap="round"/>`;
  const li=s.data.length-1;g+=`<circle cx="${x(li)}" cy="${y(s.data[li])}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="2"/>`});
 g+=`<line class="hl" x1="0" x2="0" y1="${Tp}" y2="${Tp+ih}" stroke="var(--line-2)" opacity="0"/>`;
 const w=iw/(labels.length-1);labels.forEach((l,i)=>g+=`<rect class="hit" data-i="${i}" x="${x(i)-w/2}" y="${Tp}" width="${w}" height="${ih}" fill="transparent"/>`);
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Emails sent and replies per month">${g}</svg><div class="tip" hidden></div>`;
 const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),hl=svg.querySelector('.hl');
 const show=i=>{const rw=svg.getBoundingClientRect().width,sc=rw/W;hl.setAttribute('x1',x(i));hl.setAttribute('x2',x(i));hl.setAttribute('opacity',1);tip.hidden=false;
   tip.style.left=Math.min(Math.max(x(i)*sc,80),rw-80)+'px';tip.style.top=Math.min(...series.map(s=>y(s.data[i])))*sc+'px';
   tip.innerHTML=`<b>${labels[i]}</b><br>`+series.map(s=>`<span style="color:${s.color}">●</span> ${s.name}: <b>${s.data[i]}</b>`).join('<br>')};
 svg.querySelectorAll('.hit').forEach(r=>{r.addEventListener('mouseenter',()=>show(+r.dataset.i));r.addEventListener('click',()=>show(+r.dataset.i));r.addEventListener('mouseleave',()=>{tip.hidden=true;hl.setAttribute('opacity',0)})});
}
function gauge(pct){const r=80,c=2*Math.PI*r,arc=c*.75,v=Math.min(1,pct/100)*arc;
 return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--sunken)" stroke-width="14" stroke-dasharray="${arc} ${c}" stroke-linecap="round" transform="rotate(135 100 100)"/><circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--ring)" stroke-width="14" stroke-dasharray="${v} ${c}" stroke-linecap="round" transform="rotate(135 100 100)"/></svg>`}

const xBtn=()=>`<button class="ibtn sm" data-act="close" aria-label="Close" title="Close">${ic('x')}</button>`;
function closeAll(){document.querySelectorAll('.scrim,.pop').forEach(n=>n.remove())}
function openModal(html,wide){closeAll();const el=document.createElement('div');el.className='scrim';el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" ${wide?'style="width:min(680px,100%)"':''}>${html}</div>`;document.body.appendChild(el);el.addEventListener('click',e=>{if(e.target===el)closeAll()});const f=el.querySelector('input,select,textarea');if(f)setTimeout(()=>f.focus(),60);return el}
function popover(btn,html){closeAll();const el=document.createElement('div');el.className='pop';el.innerHTML=html;document.body.appendChild(el);
 const r=btn.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;let x=r.right+10,y=r.top;
 if(innerWidth<860||x+w>innerWidth-12){x=Math.min(Math.max(12,r.left+r.width-w),innerWidth-w-12);y=r.bottom+8}
 el.style.left=x+'px';el.style.top=Math.max(12,Math.min(y,innerHeight-h-12))+'px';
 setTimeout(()=>document.addEventListener('click',function hh(e){if(!el.contains(e.target)){el.remove();document.removeEventListener('click',hh)}}),0)}
let tt;function toast(msg,i='check'){document.querySelectorAll('.toast').forEach(n=>n.remove());const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=ic(i)+'<span>'+esc(msg)+'</span>';document.body.appendChild(el);clearTimeout(tt);tt=setTimeout(()=>el.remove(),2600)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='SELECT')return;const f=A[b.dataset.act];if(f){if(b.tagName==='A')e.preventDefault();f(b,e)}});

 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act], tr[data-act]')&&!e.target.matches('button')){e.preventDefault();const f=A[e.target.dataset.act];f&&f(e.target,{target:e.target})}
});

/* ================= render ================= */
function current(){const v=location.hash.slice(1);return V[v]?v:'overview'}
function render(keep){
 const v=current(),el=document.getElementById('view');chrome(v);
 el.innerHTML=V[v]();
 if(!keep){el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter');countUp()}
 V[v].after&&V[v].after();save();
}
function rerenderKeep(id){const el=document.getElementById(id),pos=el.selectionStart;render(true);const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
window.addEventListener('hashchange',()=>{closeAll();render();scrollTo({top:0})});
let th='light';try{th=localStorage.getItem('celetel-theme-v2')||'light'}catch(e){}
document.documentElement.dataset.theme=th;
render();
</script>
